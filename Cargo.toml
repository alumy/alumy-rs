[workspace]
members = [
    ".",
    "examples/linux",
    "examples/bare",
    "examples/freertos",
    "examples/embassy",
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace.package]
version = "0.1.14"
edition = "2021"
authors = ["jack <jackchanrs@gmail.com>"]
license = "MIT"
repository = "https://github.com/alumy/alumy-rs"
homepage = "https://github.com/alumy/alumy-rs"
documentation = "https://docs.rs/alumy"
readme = "README.md"
rust-version = "1.70"

[workspace.dependencies]
anyhow = "1.0.100"
crossbeam = "0.8.4"
libc = "0.2.180"
rolling-file = "0.2.0"
time = { version = "0.3.41", features = ["macros", "local-offset", "formatting"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "local-time"] }

[package]
name = "alumy"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A cross-platform Rust SDK for Linux and MCU development."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords = ["cross-platform", "sdk", "utilities", "logging", "embedded"]
categories = ["development-tools", "embedded", "os"]
rust-version.workspace = true
exclude = [
    ".cargo/**",
    ".claude/**",
    ".codex/**",
    "AGENTS.md",
    "CLAUDE.md",
    "SKILL.md",
]

[dependencies]
anyhow = { workspace = true, optional = true }
crossbeam = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
rolling-file = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tracing.workspace = true

[features]
default = ["linux"]
alloc = []
linux = [
    "alloc",
    "dep:anyhow",
    "dep:crossbeam",
    "dep:libc",
    "dep:rolling-file",
    "dep:time",
    "dep:tracing",
    "dep:tracing-subscriber",
]
bare = []
freertos = []
embassy = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
